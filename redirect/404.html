<!DOCTYPE html>
<!--
  GitHub Pages serves this file for any path under
  https://bayesian-graphical-modelling-lab.github.io/bgms-docs/ that does not
  exist, which is every path now that the site is published to the canonical
  address. It carries the requested path across to the canonical site so a
  bookmarked deep link lands on its own page rather than the homepage.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>bgms documentation has moved</title>
<link rel="canonical" href="https://bayesian-graphical-modelling-lab.github.io/bgms/">
<meta http-equiv="refresh" content="1; url=https://bayesian-graphical-modelling-lab.github.io/bgms/">
<script>
  var base = "https://bayesian-graphical-modelling-lab.github.io/bgms/";
  var path = window.location.pathname.replace(/^\/bgms-docs\/?/, "");
  window.location.replace(base + path + window.location.search + window.location.hash);
</script>
<style>
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
         margin: 4rem auto; max-width: 34rem; padding: 0 1.5rem;
         line-height: 1.6; }
</style>
</head>
<body>
<h1>The bgms documentation has moved</h1>
<p>It now lives at
<a href="https://bayesian-graphical-modelling-lab.github.io/bgms/">bayesian-graphical-modelling-lab.github.io/bgms</a>.
You should be redirected automatically.</p>
</body>
</html>
