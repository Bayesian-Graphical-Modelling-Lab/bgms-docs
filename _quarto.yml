project:
  type: website
  output-dir: docs

highlight-style: a11y

website:
  title: "bgms"
  description: "Bayesian Graphical Models in R"
  site-url: https://bayesian-graphical-modelling-lab.github.io/bgms-docs
  repo-url: https://github.com/Bayesian-Graphical-Modelling-Lab/bgms
  repo-actions: [edit, issue]
  page-navigation: true
  bread-crumbs: true
  search:
    show-item-context: true
    type: overlay

  page-footer:
    left: |
      Developed by the [BGM Lab](https://bayesiangraphicalmodeling.com)
    center:
      - text: "Guide"
        href: guide/index.qmd
      - text: "Reference"
        href: reference/index.qmd
      - text: "Manual"
        href: manual/index.qmd
    right:
      - icon: github
        href: https://github.com/Bayesian-Graphical-Modelling-Lab/bgms
        aria-label: bgms GitHub

  navbar:
    background: light
    logo: bgms_sticker.svg
    logo-alt: "bgms logo"
    title: false
    collapse-below: lg
    left:
      - text: "Overview"
        href: index.qmd
      - text: "Get Started"
        href: guide/getting-started.qmd
      - text: "Guide"
        href: guide/index.qmd
      - text: "Reference"
        href: reference/index.qmd
      - text: "Manual"
        href: manual/index.qmd
    tools:
      - icon: github
        href: https://github.com/Bayesian-Graphical-Modelling-Lab/bgms
        text: bgms GitHub

  sidebar:
    - id: guide
      title: "User's Guide"
      style: "floating"
      collapse-level: 2
      align: left
      contents:
        - guide/index.qmd
        - guide/getting-started.qmd
        - section: "Models"
          contents:
            - guide/omrf.qmd
            - guide/ggm.qmd
        - section: "Inference"
          contents:
            - guide/edge-selection.qmd
            - guide/group-comparison.qmd
            - guide/prior-guide.qmd

    - id: reference
      title: "Reference"
      style: "floating"
      collapse-level: 2
      align: left
      contents:
        - reference/index.qmd
        - section: "Core Functions"
          contents:
            - reference/bgm.qmd
            - reference/bgmCompare.qmd
        - section: "Methods"
          contents:
            - reference/methods.qmd
        - reference/extractors.qmd
        - reference/datasets.qmd

    - id: manual
      title: "Manual"
      style: "floating"
      collapse-level: 2
      align: left
      contents:
        - manual/index.qmd
        - manual/architecture.qmd
        - section: "MCMC"
          contents:
            - manual/nuts.qmd
            - manual/warmup.qmd
        - manual/model-classes.qmd
        - manual/numerical.qmd

format:
  html:
    respect-user-color-scheme: true
    toc: true
    theme:
      light: [cosmo, theme.scss]
      dark: [cosmo, theme-dark.scss]
    code-copy: true
    code-overflow: wrap
    css: styles.css
    include-after-body: js.html
    grid:
      sidebar-width: 250px
      body-width: 900px
      margin-width: 300px

filters:
  - filters/tools-tabset.lua
  - filters/color-box.lua
  - at: post-quarto
    path: filters/include-dark.lua
