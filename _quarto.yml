project:
  type: website
  output-dir: docs
  resources:
    - icons/
    # Companion scripts for the Examples series, written by the pre-render step.
    - examples/R/
    # Datasets used by Examples pages that are not shipped with bgms, published
    # so the companion scripts can download them from the site.
    - data/
  # Regenerates examples/R/NN-slug.R from the Examples pages, so the companion
  # script published beside a page always matches that page.
  pre-render: scripts/extract-example-code.R
  # Writes the stubs that keep the previous pkgdown site's URLs alive, then the
  # version index the navbar switcher reads, then the marking that tells a
  # development build apart from the released one. Order matters: the marking
  # runs last so it reaches the stubs as well as the pages.
  post-render:
    - scripts/redirects.R
    - scripts/versions.R
    - scripts/dev-build.R

execute:
  freeze: true

highlight-style: a11y

website:
  title: "bgms"
  favicon: bgms_sticker.svg
  description: "Bayesian Graphical Models in R"
  site-url: https://bayesian-graphical-modelling-lab.github.io/bgms
  repo-url: https://github.com/Bayesian-Graphical-Modelling-Lab/bgms-docs
  repo-actions: [edit, issue]
  page-navigation: true
  bread-crumbs: true
  search:
    show-item-context: true
    type: overlay

  page-footer:
    left: |
      Developed by the [BGM Lab](https://bayesiangraphicalmodeling.com)
    center:
      - text: "FAQ"
        href: faq.qmd
      - text: "Built with Quarto"
        href: https://quarto.org
    right:
