  sidebar:
    # Lists only pages that exist. The full series, including the entries not
    # yet published, lives in the prose of examples/index.qmd.
    - id: examples
      title: "Worked analyses"
      style: "floating"
      collapse-level: 1
      align: left
      contents:
        - examples/index.qmd
        - examples/estimation-to-evidence.qmd
        - examples/reading-the-output.qmd
        - examples/check-your-priors.qmd
        - examples/comparing-groups.qmd
        - examples/edge-clustering.qmd
        - examples/from-bootnet-qgraph.qmd

    - id: guide
      title: "User's Guide"
      style: "floating"
      collapse-level: 1
      align: left
      contents:
        - guide/index.qmd
        - guide/getting-started.qmd
        - section: "Background"
          contents:
            - guide/graphical-models.qmd
            - guide/bayesian-approach.qmd
            - guide/prior-basics.qmd
        - section: "Models"
          contents:
            - guide/ggm.qmd
            - guide/omrf.qmd
            - guide/mixed-model.qmd
        - section: "Analyses"
          contents:
            - guide/edge-selection.qmd
            - guide/group-comparison.qmd
            - guide/clustering.qmd
            - guide/missing-data.qmd
        - section: "Output & Diagnostics"
          contents:
            - guide/mcmc-output.qmd
            - guide/mcmc-diagnostics.qmd

    - id: reference
      title: "Reference"
      style: "floating"
      collapse-level: 1
      align: left
      contents:
        - reference/index.qmd
        - section: "Core Functions"
          contents:
            - reference/bgm.qmd
            - reference/bgmCompare.qmd
        - section: "Priors"
          contents:
            - reference/priors.qmd
            - reference/sample-ggm-prior.qmd
            - reference/prior-samplers.qmd
        - section: "Methods"
          contents:
            - reference/methods.qmd
        - section: "Diagnostics"
          contents:
            - reference/checks.qmd
            - reference/prior-sensitivity.qmd
        - reference/extractors.qmd
        - reference/datasets.qmd

    - id: manual
      title: "Manual"
      style: "floating"
      collapse-level: 1
      align: left
      contents:
        - manual/index.qmd
        - section: "Architecture"
          contents:
            - manual/architecture.qmd
            - manual/r-scaffolding.qmd
            - manual/model-classes.qmd
            - manual/parallel-chains.qmd
        - section: "MCMC Algorithms"
          contents:
            - manual/metropolis.qmd
            - manual/nuts.qmd
            - manual/null-space.qmd
        - section: "Sampler Infrastructure"
          contents:
            - manual/samplers.qmd
            - manual/warmup.qmd
            - manual/diagnostics.qmd
        - section: "Model Internals"
          contents:
            - manual/ggm-internals.qmd
            - manual/omrf-internals.qmd
            - manual/mixed-internals.qmd
            - section: "Supporting Pages"
              contents:
                - manual/pseudolikelihood.qmd
                - manual/variable-helpers.qmd
                - manual/simulation-prediction.qmd
        - section: "Priors"
          contents:
            - manual/parameter-priors.qmd
            - manual/edge-priors.qmd
            - manual/sbm-prior.qmd
            - manual/zratio-hierarchical.qmd
        - section: "Results and Checks"
          contents:
            - manual/fit-objects.qmd
        - manual/bgmcompare-internals.qmd
        - manual/numerical.qmd

bibliography: references.bib
csl: apa.csl

format:
  html:
    respect-user-color-scheme: true
    toc: false
    theme:
      light: [cosmo, theme.scss]
      dark: [cosmo, theme-dark.scss]
    code-copy: true
    code-overflow: wrap
    css: styles.css
    include-after-body: js.html
    grid:
      sidebar-width: 250px
      body-width: 1100px
      margin-width: 200px

filters:
  - filters/color-box.lua
  - at: post-quarto
    path: filters/include-dark.lua
