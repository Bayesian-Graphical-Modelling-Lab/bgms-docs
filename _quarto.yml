project:
  type: website
  output-dir: docs

highlight-style: a11y

website:
  title: "bgms"
  description: "Bayesian Graphical Models in R"
  site-url: https://bayesian-graphical-modelling-lab.github.io/bgms
  repo-url: https://github.com/Bayesian-Graphical-Modelling-Lab/bgms
  repo-actions: [edit, issue]
  page-navigation: true
  bread-crumbs: true
  search:
    show-item-context: true
    type: overlay

  page-footer:
    left: |
      Developed by the [BGM Lab](https://bayesiangraphicalmodeling.com)
    center:
      - text: "Guide"
        href: guide/index.qmd
      - text: "Reference"
        href: reference/index.qmd
      - text: "Manual"
        href: manual/index.qmd
    right:
      - icon: github
        href: https://github.com/Bayesian-Graphical-Modelling-Lab/bgms
        aria-label: bgms GitHub

  navbar:
    background: light
    logo: bgms_sticker.svg
    logo-alt: "bgms logo"
    title: false
    collapse-below: lg
    left:
      - text: "Overview"
        href: index.qmd
      - text: "Get Started"
        href: guide/getting-started.qmd
      - text: "Guide"
        href: guide/index.qmd
      - text: "Reference"
        href: reference/index.qmd
      - text: "Manual"
        href: manual/index.qmd
      - text: "Examples"
        href: examples/index.qmd
    tools:
      - icon: github
        href: https://github.com/Bayesian-Graphical-Modelling-Lab/bgms
        text: bgms GitHub

  sidebar:
    - id: guide
      title: "User's Guide"
      style: "floating"
      collapse-level: 2
      align: left
      contents:
        - guide/index.qmd
        - guide/getting-started.qmd
        - section: "Background"
          contents:
            - guide/graphical-models.qmd
            - guide/bayesian-approach.qmd
            - guide/prior-basics.qmd
        - section: "Models"
          contents:
            - guide/ggm.qmd
            - guide/omrf.qmd
            - guide/mixed-model.qmd
        - section: "Analyses"
          contents:
            - guide/edge-selection.qmd
            - guide/group-comparison.qmd
            - guide/clustering.qmd
        - section: "MCMC Output"
          contents:
            - guide/mcmc-output.qmd
            - guide/mcmc-diagnostics.qmd

    - id: reference
      title: "Reference"
      style: "floating"
      collapse-level: 2
      align: left
      contents:
        - reference/index.qmd
        - section: "Core Functions"
          contents:
            - reference/bgm.qmd
            - reference/bgmCompare.qmd
        - section: "Methods"
          contents:
            - reference/methods.qmd
        - reference/extractors.qmd
        - reference/datasets.qmd

    - id: manual
      title: "Manual"
      style: "floating"
      collapse-level: 2
      align: left
      contents:
        - manual/index.qmd
        - section: "Architecture"
          contents:
            - manual/architecture.qmd
            - manual/r-scaffolding.qmd
            - manual/model-classes.qmd
        - section: "MCMC Engine"
          contents:
            - manual/samplers.qmd
            - manual/nuts.qmd
            - manual/warmup.qmd
            - manual/parallel-chains.qmd
        - section: "Models"
          contents:
            - manual/ggm-internals.qmd
            - manual/omrf-internals.qmd
            - manual/variable-helpers.qmd
            - manual/mixed-internals.qmd
        - section: "Priors & Edge Selection"
          contents:
            - manual/edge-priors.qmd
            - manual/sbm-prior.qmd
        - section: "Group Comparison"
          contents:
            - manual/bgmcompare-internals.qmd
        - section: "Numerical Methods"
          contents:
            - manual/numerical.qmd

    - id: examples
      title: "Examples"
      style: "floating"
      collapse-level: 2
      align: left
      contents:
        - examples/index.qmd
        - examples/binary-network.qmd
        - examples/ordinal-network.qmd
        - examples/continuous-network.qmd
        - examples/mixed-network.qmd
        - examples/group-comparison.qmd
        - examples/clustering.qmd

format:
  html:
    respect-user-color-scheme: true
    toc: false
    theme:
      light: [cosmo, theme.scss]
      dark: [cosmo, theme-dark.scss]
    code-copy: true
    code-overflow: wrap
    css: styles.css
    include-after-body: js.html
    grid:
      sidebar-width: 250px
      body-width: 1100px
      margin-width: 200px

filters:
  - filters/color-box.lua
  - at: post-quarto
    path: filters/include-dark.lua
