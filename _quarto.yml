project:
  type: website
  output-dir: docs

website:
  title: "bgms"
  description: "Bayesian Graphical Models in R"

  navbar:
    logo: bgms_sticker.svg
    left:
      - text: "Guide"
        href: guide/index.qmd
      - text: "Reference"
        href: reference/index.qmd
      - text: "Manual"
        href: manual/index.qmd
      - text: "Examples"
        href: examples/index.qmd
    right:
      - text: "BGM Lab"
        href: https://bayesiangraphicalmodeling.com
      - icon: github
        href: https://github.com/Bayesian-Graphical-Modelling-Lab/bgms

  sidebar:
    - title: "User's Guide"
      style: docked
      contents:
        - guide/index.qmd
        - guide/getting-started.qmd
        - section: "Background"
          contents:
            - guide/graphical-models.qmd
            - guide/bayesian-approach.qmd
            - guide/prior-basics.qmd
        - section: "Models"
          contents:
            - guide/ggm.qmd
            - guide/omrf.qmd
            - guide/mixed-model.qmd
        - section: "Analyses"
          contents:
            - guide/edge-selection.qmd
            - guide/group-comparison.qmd
            - guide/clustering.qmd
        - section: "MCMC Output"
          contents:
            - guide/mcmc-output.qmd
            - guide/mcmc-diagnostics.qmd

    - title: "Reference"
      contents:
        - reference/index.qmd
        - section: "Core Functions"
          contents:
            - reference/bgm.qmd
            - reference/bgmCompare.qmd
        - section: "Methods"
          contents:
            - reference/methods.qmd
        - reference/extractors.qmd
        - reference/datasets.qmd

    - title: "Manual"
      contents:
        - manual/index.qmd
        - section: "Architecture"
          contents:
            - manual/architecture.qmd
            - manual/r-scaffolding.qmd
            - manual/model-classes.qmd
        - section: "MCMC Engine"
          contents:
            - manual/samplers.qmd
            - manual/nuts.qmd
            - manual/warmup.qmd
            - manual/parallel-chains.qmd
        - section: "Models"
          contents:
            - manual/ggm-internals.qmd
            - manual/omrf-internals.qmd
            - manual/variable-helpers.qmd
            - manual/mixed-internals.qmd
        - section: "Priors & Edge Selection"
          contents:
            - manual/edge-priors.qmd
            - manual/sbm-prior.qmd
        - section: "Group Comparison"
          contents:
            - manual/bgmcompare-internals.qmd
        - section: "Numerical Methods"
          contents:
            - manual/numerical.qmd

    - title: "Examples"
      contents:
        - examples/index.qmd
        - examples/binary-network.qmd
        - examples/ordinal-network.qmd
        - examples/continuous-network.qmd
        - examples/mixed-network.qmd
        - examples/group-comparison.qmd
        - examples/clustering.qmd

  search:
    location: navbar
    type: overlay

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: styles.css
    toc: true
    toc-depth: 3
    code-copy: true
    code-overflow: wrap
    highlight-style: github
