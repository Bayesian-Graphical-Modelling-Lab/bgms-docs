name: Build and Deploy Documentation

on:
  push:
    branches: [main, docs/cycle-*]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::knitr
            any::rmarkdown
            any::remotes
            any::qgraph

      - name: Install bgms from GitHub
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: Rscript -e 'remotes::install_github("Bayesian-Graphical-Modelling-Lab/bgms")'

      - name: Verify qgraph is available
        run: Rscript -e 'stopifnot(requireNamespace("qgraph", quietly = TRUE)); cat("qgraph version:", as.character(utils::packageVersion("qgraph")), "\n")'

      - name: Render site
        run: |
          rm -rf _freeze
          quarto render

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
